# ES-PF: web app + API in one Worker.
# Production: the deploy workflow (.github/workflows/pf-deploy.yml) sets the secrets DATABASE_URL (Neon),
# AUTH_SECRET and ANTHROPIC_API_KEY, and APP_URL, then runs `wrangler deploy`.
# Local testing against a local Postgres: `wrangler dev --env local` (Hyperdrive emulation, see [env.local]).
name = "espf"
main = "src/index.ts"
account_id = "52e4e5ca8c5d60d092cd547b12b1ff92"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "espf-documents"

[env.local]
name = "espf-local"
[env.local.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
[[env.local.r2_buckets]]
binding = "FILES"
bucket_name = "espf-documents"
[[env.local.hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
[env.local.vars]
APP_URL = "http://localhost:8788"

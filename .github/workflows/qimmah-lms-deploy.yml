# Deploys the Al-Qimmah remote-learning platform (qimmah-lms/) to Cloudflare.
# Separate from the EnvironmSafe website, which Cloudflare Pages deploys itself.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and for the
# FIRST deploy QIMMAH_CREDENTIALS (contents of qimmah-lms/.secrets/credentials.json)
# so the seeded accounts match the credential list already handed out.
name: Qimmah LMS deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['qimmah-lms/**', '.github/workflows/qimmah-lms-deploy.yml']

concurrency:
  group: qimmah-lms-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qimmah-lms
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the Qimmah LMS deploy."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        if: steps.check.outputs.skip != '1'
      - run: npm run deploy
        if: steps.check.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QIMMAH_CREDENTIALS: ${{ secrets.QIMMAH_CREDENTIALS }}

name: ES-PF CI

on:
  pull_request:
    paths: ['pf/**', '.github/workflows/pf-ci.yml']
  push:
    branches: [main]
    paths: ['pf/**', '.github/workflows/pf-ci.yml']

jobs:
  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Postgres 16 + pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
      - name: Start a throw-away cluster
        run: |
          # The postgres user cannot enter the runner's home directory, so use /tmp.
          D=/tmp/espf-pg
          sudo mkdir -p $D && sudo chown postgres $D
          sudo -u postgres /usr/lib/postgresql/16/bin/initdb -D $D/data -U postgres -A trust >/dev/null
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D $D/data -o "-p 54329 -k $D" -l $D/log start
          echo "PGHOST=$D" >> $GITHUB_ENV
          echo "PGPORT=54329" >> $GITHUB_ENV
      - name: Run migrations and tests
        run: pf/db/scripts/test.sh

  web:
    name: Web app (typecheck, unit tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pf/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pf/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pdf:
    name: Printed documents (visual match with the samples)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pf/pdf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-core
      - run: pip install -r requirements-dev.txt
      - run: python -m tests.visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-overlays
          path: pf/pdf/tests/out/

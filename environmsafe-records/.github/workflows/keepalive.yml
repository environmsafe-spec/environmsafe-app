name: Keep database awake

# Supabase pauses free projects after about a week without activity. This
# touches the database every two days. A failure here e-mails the repo owner.
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          set -euo pipefail
          URL=$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
          KEY=$(grep '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          for i in 1 2 3; do
            R=$(curl -fsS -X POST "$URL/rest/v1/rpc/keepalive" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' || true)
            echo "attempt $i: $R"
            case "$R" in *ok*) echo "### Database awake: $R" >> "$GITHUB_STEP_SUMMARY"; exit 0;; esac
            sleep 30
          done
          echo "::error::Database did not answer. It may be paused: open supabase.com and press Restore (see docs/RUNBOOK.md)."
          exit 1
